name: ci
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "dev"
      - "feature/**"
    tags-ignore:
      - "*"

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: List documentation files
        run: git -c core.quotepath=false ls-files --cached --others --exclude-standard --deduplicate '*.md' '*.markdown' > "$RUNNER_TEMP/doc-files.txt"

      - name: Check internal documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: latest
          args: --offline --include-fragments --no-progress --files-from "${{ runner.temp }}/doc-files.txt"
          output: ${{ runner.temp }}/lychee-report.md

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Test and build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build
          pnpm run check:build

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Test and build backend
        working-directory: backend
        env:
          GOSUMDB: "off"
          CGO_ENABLED: "0"
        run: |
          go mod download
          go vet ./...
          go test ./...
          go build -trimpath -tags=nomsgpack -ldflags="-s -w" -o /tmp/QMediaSync .

  release-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Test release and fnOS scripts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash -n scripts/release/release.sh scripts/release/package-fnos.sh scripts/release/package-release-asset.sh scripts/release/install-fnpack.sh backend/fnos/common/service.sh
          for script in backend/fnos/qmediasync-*/cmd/*; do bash -n "$script"; done

  windows-restart:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Test native Windows restart
        working-directory: backend
        env:
          GOSUMDB: "off"
          CGO_ENABLED: "0"
        run: go test ./internal/helpers -run 'Test(SupportsAppRestart|StopAppWaitsForShutdownWithoutTray|RestartChildArgumentsAndDirectory|InitialConfigWindowsRestart|AcquireInstanceLock)$' -count=1
